services:
  csv-merge:
    build: ./csv-3way-merge
    image: csv-3way-merge:latest
    container_name: csv-3way-merge
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
